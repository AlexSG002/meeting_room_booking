name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: ${{ matrix.module }} (Java 21)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - meeting-booking-api
          - notification-service
    env:
      RESEND_API_KEY: test-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: ${{ matrix.module }}

  frontend:
    name: Frontend (Node.js 24)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: meeting-booking-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: meeting-booking-frontend

      - name: Run frontend tests
        run: npm test -- --watch=false
        working-directory: meeting-booking-frontend

      - name: Build frontend
        run: npm run build
        working-directory: meeting-booking-frontend
