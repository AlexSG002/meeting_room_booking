#-----------APLICACIÓN-----------------
spring.application.name=meetingbooking

#------------DATASOURCE----------------
spring.datasource.url=jdbc:mysql://localhost:3306/meetingBooking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#--------------------JPA/HIBERNATE-------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#--------------------FLYWAY-------------------------
spring.flyway.enabled=true

#--------------------SERVER-------------------------
server.port=8080
#--------------------KAFKA--------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=meeting-booking-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.alejandro.meetingbooking.event

